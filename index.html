<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta name="google-site-verification" content="1lwrd95gWzZbYhFcKMypbYYxTk8JIxKFCG16uV43CK8" />

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="TMovies - A simple movie catalog website">

  <title>TMovies</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #0b0b0f;
      color: white;
    }

    header {
      background: #111116;
      padding: 18px 5%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .logo {
      font-size: 28px;
      font-weight: bold;
      color: #ff1744;
    }

    .search {
      width: 300px;
      max-width: 60%;
      padding: 12px 16px;
      border: none;
      border-radius: 25px;
      background: #22222a;
      color: white;
      outline: none;
    }

    .hero {
      padding: 70px 5%;
      background: linear-gradient(135deg, #1b1b25, #0b0b0f);
    }

    .hero h1 {
      font-size: 42px;
      margin-bottom: 12px;
    }

    .hero p {
      color: #aaa;
      font-size: 17px;
    }

    .section {
      padding: 35px 5%;
    }

    .section h2 {
      margin-bottom: 25px;
      font-size: 28px;
    }

    .movies {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 24px;
    }

    .card {
      background: #15151c;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,.35);
      transition: .3s;
    }

    .card:hover {
      transform: translateY(-6px);
    }

    .card img {
      width: 100%;
      height: 380px;
      object-fit: cover;
      display: block;
    }

    .content {
      padding: 18px;
    }

    .content h3 {
      font-size: 22px;
      margin-bottom: 10px;
    }

    .rating {
      color: #ffd54f;
      margin-bottom: 8px;
    }

    .genre {
      color: #999;
      margin-bottom: 15px;
    }

    button {
      background: #ff1744;
      color: white;
      border: none;
      padding: 11px 18px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }

    button:hover {
      background: #d50032;
    }

    footer {
      text-align: center;
      padding: 30px;
      color: #777;
      border-top: 1px solid #222;
      margin-top: 30px;
    }

    .no-result {
      display: none;
      color: #aaa;
      padding: 20px 0;
    }

    @media (max-width: 800px) {
      .movies {
        grid-template-columns: repeat(2, 1fr);
      }

      .card img {
        height: 300px;
      }
    }

    @media (max-width: 520px) {
      header {
        flex-direction: column;
        align-items: stretch;
      }

      .search {
        max-width: 100%;
        width: 100%;
      }

      .movies {
        grid-template-columns: 1fr;
      }

      .hero h1 {
        font-size: 32px;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="logo">TMovies</div>

  <input
    type="text"
    id="search"
    class="search"
    placeholder="Search movies..."
  >
</header>

<section class="hero">
  <h1>Welcome to TMovies</h1>
  <p>Discover movies and explore your favorite titles.</p>
</section>

<section class="section">
  <h2>Latest Releases</h2>

  <div class="movies" id="movies">

    <div class="card" data-title="Tara Tarini">
      <img src="images/movie1.png" alt="Tara Tarini">
      <div class="content">
        <h3>Tara Tarini</h3>
        <div class="rating">★ 8.5/10</div>
        <div class="genre">Drama • Adventure</div>
        <button onclick="showDetails('Tara Tarini', '8.5/10')">
          Details
        </button>
      </div>
    </div>

    <div class="card" data-title="Tomka">
      <img src="images/movie2.png" alt="Tomka">
      <div class="content">
        <h3>Tomka</h3>
        <div class="rating">★ 8.2/10</div>
        <div class="genre">Action • Drama</div>
        <button onclick="showDetails('Tomka', '8.2/10')">
          Details
        </button>
      </div>
    </div>

    <div class="card" data-title="Jagadish">
      <img src="images/movie3.png" alt="Jagadish">
      <div class="content">
        <h3>Jagadish</h3>
        <div class="rating">★ 8.7/10</div>
        <div class="genre">Action • Thriller</div>
        <button onclick="showDetails('Jagadish', '8.7/10')">
          Details
        </button>
      </div>
    </div>

  </div>

  <div class="no-result" id="noResult">
    No movie found.
  </div>
</section>

<footer>
  © 2026 TMovies. All rights reserved.
</footer>

<script>
  const search = document.getElementById("search");
  const cards = document.querySelectorAll(".card");
  const noResult = document.getElementById("noResult");

  search.addEventListener("input", function () {
    const query = this.value.toLowerCase();
    let found = 0;

    cards.forEach(card => {
      const title = card.dataset.title.toLowerCase();

      if (title.includes(query)) {
        card.style.display = "block";
        found++;
      } else {
        card.style.display = "none";
      }
    });

    noResult.style.display = found === 0 ? "block" : "none";
  });

  function showDetails(title, rating) {
    alert(
      "Movie: " + title +
      "\nRating: " + rating
    );
  }
</script>

</body>
</html>
